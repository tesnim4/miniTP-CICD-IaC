- name: Configurer un serveur web Linux (extension facultative)
  hosts: web
  become: true
  tasks:
    - name: Installer Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Copier la page d'accueil
      ansible.builtin.copy:
        src: ../index.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'
      notify: Recharger Nginx

    - name: S'assurer que Nginx est démarré
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Recharger Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
