name: CI - Mini TP CI-CD IaC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-infrastructure:
    name: Vérifier Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Vérifier le format
        run: terraform fmt -check -recursive

      - name: Initialiser Terraform
        run: terraform init -backend=false

      - name: Valider la configuration
        run: terraform validate

  build-and-test:
    name: Construire et tester l'image Docker
    runs-on: ubuntu-latest
    needs: validate-infrastructure
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t mini-tp-cicd:${{ github.sha }} .

      - name: Démarrer le conteneur
        run: docker run -d --name mini-tp-web -p 8081:80 mini-tp-cicd:${{ github.sha }}

      - name: Tester la page web
        run: curl --fail http://localhost:8081

      - name: Nettoyer le conteneur
        if: always()
        run: docker rm -f mini-tp-web || true
